{#
  Revisão pedida pelo Claude (MCP) terminou — ou falhou (RPI-37).

  A revisão roda em segundo plano e o Claude não é avisado quando ela acaba; o
  e-mail é o aviso. Vai só para quem pediu.

  Restrições de cliente de e-mail: sem Bootstrap, sem <style> externo — tudo em
  tabelas com CSS inline.

  Contexto: user, execution, petition_title, identifier, ok, total_findings,
  by_severity [(gravidade, qtd)], link (absoluto, via revision_result_url).
#}
<!DOCTYPE html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#f8f9fa;font-family:Arial,Helvetica,sans-serif;color:#212529;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f9fa;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px;background:#ffffff;border:1px solid #dee2e6;border-radius:8px;">
        <tr><td style="padding:28px 28px 8px;">
          <div style="font-size:18px;font-weight:700;">
            {% if ok %}Revisão pronta{% else %}Revisão não concluída{% endif %}
          </div>
          <div style="font-size:13px;color:#6c757d;margin-top:4px;">
            {{ petition_title }} · Id Wrike {{ identifier }} · revisão {{ execution.revision_number }}
          </div>
        </td></tr>
        <tr><td style="padding:8px 28px;font-size:14px;line-height:1.6;">
          Olá, {{ user.name }}.<br><br>
          {% if ok %}
            A revisão que você pediu pelo Claude terminou
            {%- if total_findings %} com {{ total_findings }} achado{{ 's' if total_findings != 1 }}:
            {%- else %} sem achados.{% endif %}
          {% else %}
            A revisão que você pediu pelo Claude não foi concluída.
            {% if execution.error_message %}<br><span style="color:#6c757d;">Motivo: {{ execution.error_message }}</span>{% endif %}
            <br>Pela tela, dá para reprocessá-la.
          {% endif %}
        </td></tr>
        {% if ok and by_severity %}
        <tr><td style="padding:0 28px 8px;font-size:14px;line-height:1.8;">
          {% for gravidade, qtd in by_severity %}
            <div>{{ qtd }} {{ gravidade }}</div>
          {% endfor %}
        </td></tr>
        {% endif %}
        <tr><td style="padding:16px 28px;">
          <a href="{{ link }}"
             style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 22px;border-radius:6px;">
            Abrir a revisão
          </a>
        </td></tr>
        <tr><td style="padding:8px 28px 28px;font-size:12px;line-height:1.6;color:#6c757d;">
          {% if ok %}No Claude, é só pedir "mostre a revisão {{ execution.id }}".<br>{% endif %}
          Se o botão não funcionar, copie este endereço no navegador:<br>
          <span style="word-break:break-all;color:#212529;">{{ link }}</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
